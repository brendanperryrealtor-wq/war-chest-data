name: war-chest-tests
# Runs the sim's test suite on every change to the engine, bots, or tests.
on:
  push:
    paths: ["sim/**", "tests/**", "engine/**", ".github/workflows/sim.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r sim/requirements.txt pytest
      - run: python -m pytest -q
